<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="refresh" content="1; url=/portfolio/">
  <title>Ryne</title>
  <style>
    @font-face {
      font-family: "Geist Variable";
      src: url("https://cdn.jsdelivr.net/npm/@fontsource-variable/geist@latest/files/geist-latin-wght-normal.woff2") format("woff2");
      font-display: swap;
    }
    html, body {
      margin: 0;
      min-height: 100dvh;
      background: #121212;
      color: #f3f3f3;
      font-family: "Geist Variable", system-ui, -apple-system, "Segoe UI", sans-serif;
    }
    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding-top: 28dvh;
      gap: 1.25rem;
      text-align: center;
    }
    .mark {
      width: 2.5rem;
      height: 2.5rem;
      border-radius: 0.75rem;
      background: #191919;
      display: grid;
      place-items: center;
    }
    .mark span {
      width: 0.95rem;
      height: 0.95rem;
      border-radius: 0.18rem;
      background: #fafbfc;
    }
    h1 {
      margin: 0;
      font-size: 1.6rem;
      font-weight: 800;
      letter-spacing: -0.02em;
    }
    p {
      margin: 0;
      color: #9a9a9a;
      font-size: 0.9rem;
    }
    p a {
      color: #f3f3f3;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <div class="mark" aria-hidden="true"><span></span></div>
  <h1>Ryne</h1>
  <p>Taking you to my website… <a href="/portfolio/">or click here</a></p>
</body>
</html>
